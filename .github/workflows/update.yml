name: update-free-nodes

# 每天北京时间 05:17 自动生成一份新的可用节点订阅
on:
  schedule:
    - cron: "17 21 * * *"      # UTC 21:17 = 北京 05:17
  workflow_dispatch:            # 也可以手动点 “Run workflow”
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-free-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: 抓取 + 测速 + 生成配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/pipeline.py --workers 128 --rounds 2 --timeout 3000

      - name: 上传产物（保留 7 天，方便回溯）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nodes-${{ github.run_id }}
          path: |
            out/flclash-free-nodes.yaml
            out/nodes.txt
          retention-days: 7
          if-no-files-found: warn

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(nodes): $(date -u +'%Y-%m-%d %H:%M UTC') 自动更新"
          git push
