name: update-free-nodes

# 每天北京时间 05:17 自动生成一份新的可用节点订阅
on:
  schedule:
    - cron: "17 21 * * *"      # UTC 21:17 = 北京 05:17
  workflow_dispatch:            # 也可以手动点 “Run workflow”
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-free-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, yaml; print(sys.version); print('PyYAML', yaml.__version__)"

      # 自建节点参数放在仓库 Secret 里，不落公开仓库（.gitignore 也排除了这个文件）
      - name: 注入自建节点参数（可选）
        env:
          SELFHOST_NODE: ${{ secrets.SELFHOST_NODE }}
        run: |
          if [ -n "$SELFHOST_NODE" ]; then
            printf '%s' "$SELFHOST_NODE" > selfhost/selfhost-node.json
            python -c "import json;d=json.load(open('selfhost/selfhost-node.json'));print('自建节点已注入，服务器:', d.get('server'))"
          else
            echo "未配置 SELFHOST_NODE，本次只生成免费节点"
          fi

      - name: 抓取 + 测速 + 生成配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          if [ -f selfhost/selfhost-node.json ]; then
            # 合并版（自建+免费）写到 .cache（不提交），公开版写到 out/
            OUT_ARGS="--out .cache/full.yaml --public-out out/flclash-free-nodes.yaml"
            OUT_ARGS="$OUT_ARGS --selfhost selfhost/selfhost-node.json"
          else
            OUT_ARGS="--out out/flclash-free-nodes.yaml"
          fi
          # --max-delay 200      : 机房（美国）测的“节点能不能出去”：谷歌/YouTube 双通 + 机房延迟上限
          # --cn-max-delay 120   : 上海实测门槛（收紧到 120ms，只留真正快的那一档）
          # --cn-max-nodes 120    : 每次最多量 120 个（全球额度 250/小时；配合下面的地区预筛，
          #                        亚太候选一般 60~120 个，等于"可能及格的都测到"）
          # --carry-max-delay 150: 上一版老节点复测，上海 RTT ≤150ms 才保留并排最前
          # --max-delay-asia 400 : 仅在探针拿不到数据时兜底，港澳台日韩新放宽
          python -u scripts/pipeline.py --workers 128 --rounds 2 --timeout 3000 \
            --max-delay 200 --max-delay-asia 400 --cn-max-delay 120 --cn-max-nodes 120 \
            --carry-max-delay 150 $OUT_ARGS 2>&1 | tee pipeline.log

      # 合并版含密钥，只推到私有 Gist；公开仓库里永远只有免费节点
      - name: 发布合并订阅到私有 Gist（可选）
        if: success()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -f .cache/full.yaml ]; then
            python scripts/publish_gist.py .cache/full.yaml flclash-full.yaml
          else
            echo "没有合并版文件（未配置自建节点），跳过"
          fi

      # 失败时把日志尾部写进注解：这样在 Actions 页面顶部“Annotations”里就能直接看到报错
      - name: 失败时输出错误摘要
        if: failure()
        run: |
          if [ -f pipeline.log ]; then
            MSG=$(tail -n 40 pipeline.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-6000)
            echo "::error title=流水线失败（最后 40 行）::$MSG"
          else
            echo "::error title=流水线失败::pipeline.log 未生成，失败发生在上传/安装等更早的步骤"
          fi

      - name: 上传产物（保留 7 天，方便回溯）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nodes-${{ github.run_id }}
          path: |
            out/flclash-free-nodes.yaml
            out/nodes.txt
            .cache/full.yaml
            pipeline.log
          retention-days: 7
          if-no-files-found: warn

      - name: 提交并推送（只提交公开版）
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(nodes): $(date -u +'%Y-%m-%d %H:%M UTC') 自动更新"
          git push

      # 用 jsDelivr 加速地址的话，它会把 @master 的旧内容缓存 12 小时（实测出现过滞后 26 小时），
      # 这里主动清一次 CDN 缓存；raw.githubusercontent.com 本身只有 5 分钟缓存，不需要处理。
      - name: 清理 jsDelivr 缓存（可选，失败不影响构建）
        if: success()
        continue-on-error: true
        run: |
          URL="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@master/out/flclash-free-nodes.yaml"
          echo "purge: $URL"
          curl -sS --max-time 40 "$URL" | head -c 300
          echo
