name: update-free-nodes

# 每天北京时间 05:17 自动生成一份新的可用节点订阅
on:
  schedule:
    - cron: "17 21 * * *"      # UTC 21:17 = 北京 05:17
  workflow_dispatch:            # 也可以手动点 “Run workflow”
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-free-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, yaml; print(sys.version); print('PyYAML', yaml.__version__)"

      # 自建节点参数放在仓库 Secret 里，不落公开仓库（.gitignore 也排除了这个文件）
      - name: 注入自建节点参数（可选）
        env:
          SELFHOST_NODE: ${{ secrets.SELFHOST_NODE }}
        run: |
          if [ -n "$SELFHOST_NODE" ]; then
            printf '%s' "$SELFHOST_NODE" > selfhost/selfhost-node.json
            python -c "import json;d=json.load(open('selfhost/selfhost-node.json'));print('自建节点已注入，服务器:', d.get('server'))"
          else
            echo "未配置 SELFHOST_NODE，本次只生成免费节点"
          fi

      - name: 抓取 + 测速 + 生成配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          if [ -f selfhost/selfhost-node.json ]; then
            # 合并版（自建+免费）写到 .cache（不提交），公开版写到 out/
            OUT_ARGS="--out .cache/full.yaml --public-out out/flclash-free-nodes.yaml"
            OUT_ARGS="$OUT_ARGS --selfhost selfhost/selfhost-node.json"
          else
            OUT_ARGS="--out out/flclash-free-nodes.yaml"
          fi
          # 策略：先按地区/协议筛选，再用真实代理链路做并发压测（等价 clash-speedtest 的 download+并发），
          #       砍掉“连不上”和“抖动大”的；globalping 上海探针已默认关闭（与真实体验相关性差）。
          # --cn-types ss,trojan : 只保留 ss/trojan（实测国内：reality 0%、ws/CDN 前缀 0%、ss/trojan 约 20%）
          # --cn-region asia_na  : 只保留 日/新/韩/台/港 + 美/加（归属未知的也留），其余剔除
          # --max-delay 200      : 机房实测延迟上限
          # --burst 6            : 每个节点同时开 6 条连接压测，成功率 ≥80%、抖动 ≤150ms 才算过
          python -u scripts/pipeline.py --workers 128 --rounds 2 --timeout 3000 \
            --cn-types ss,trojan --cn-region asia_na --max-delay 200 \
            --burst 6 --burst-min-ok 0.8 --burst-jitter 150 \
            --min-nodes 3 \
            --second-out out/flclash-broad.yaml \
            --second-regions HK,TW,JP,KR,SG,CA $OUT_ARGS 2>&1 | tee pipeline.log

      # 合并版含密钥，只推到私有 Gist；公开仓库里永远只有免费节点
      - name: 发布合并订阅到私有 Gist（可选）
        if: success()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -f .cache/full.yaml ]; then
            python scripts/publish_gist.py .cache/full.yaml flclash-full.yaml
          else
            echo "没有合并版文件（未配置自建节点），跳过"
          fi

      # 失败时把日志尾部写进注解：这样在 Actions 页面顶部“Annotations”里就能直接看到报错
      - name: 失败时输出错误摘要
        if: failure()
        run: |
          if [ -f pipeline.log ]; then
            MSG=$(tail -n 40 pipeline.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-6000)
            echo "::error title=流水线失败（最后 40 行）::$MSG"
          else
            echo "::error title=流水线失败::pipeline.log 未生成，失败发生在上传/安装等更早的步骤"
          fi

      - name: 上传产物（保留 7 天，方便回溯）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nodes-${{ github.run_id }}
          path: |
            out/flclash-free-nodes.yaml
            out/nodes.txt
            .cache/full.yaml
            pipeline.log
          retention-days: 7
          if-no-files-found: warn

      - name: 提交并推送（只提交公开版）
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(nodes): $(date -u +'%Y-%m-%d %H:%M UTC') 自动更新"
          git push

      # 失败时把日志尾部写进仓库：这样即使没有 Actions 权限，也能从仓库里看到失败原因
      - name: 失败时把日志尾部写进仓库（可选，失败不影响）
        if: failure()
        continue-on-error: true
        run: |
          if [ -f pipeline.log ]; then
            {
              echo "# 上次构建失败：$(date -u +'%Y-%m-%d %H:%M UTC')"
              echo ""
              echo '```'
              tail -n 150 pipeline.log
              echo '```'
            } > out/last-failure.md
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add out/last-failure.md
            git commit -m "chore(diag): 记录失败日志 $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            git push || true
          fi

      # 用 jsDelivr 加速地址的话，它会把 @master 的旧内容缓存 12 小时（实测出现过滞后 26 小时），
      # 这里主动清一次 CDN 缓存；raw.githubusercontent.com 本身只有 5 分钟缓存，不需要处理。
      - name: 清理 jsDelivr 缓存（可选，失败不影响构建）
        if: success()
        continue-on-error: true
        run: |
          URL="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@master/out/flclash-free-nodes.yaml"
          echo "purge: $URL"
          curl -sS --max-time 40 "$URL" | head -c 300
          echo
